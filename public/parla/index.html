<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Parla! Italian Coach</title>
<meta name="theme-color" content="#C24E2D">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Parla!">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF6EE;--card:#fff;--ink:#1E2621;--mute:#6A6E64;--line:#EADFCF;--terra:#C24E2D;--terra2:#F7E3DA;--olive:#4C6B3C;--olive2:#E3ECDA;--gold:#D9982A;--gold2:#FBEFD5;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3,.serif{font-family:Fraunces,Georgia,serif;letter-spacing:-.01em;margin:0}
h1{font-size:28px;line-height:1.15}h2{font-size:21px;line-height:1.2}h3{font-size:17px}
small,.mute{color:var(--mute)}small{font-size:12.5px;font-family:Inter,sans-serif;font-weight:500}
.top{position:sticky;top:0;z-index:20;background:rgba(251,246,238,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;border-bottom:1px solid var(--line)}
.top .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
.logo{font-family:Fraunces,serif;font-weight:700;font-size:22px;display:flex;align-items:center;gap:8px}
.flag{display:inline-flex;width:18px;height:14px;border-radius:3px;overflow:hidden}.flag i{flex:1}.flag i:nth-child(1){background:#2E7D4F}.flag i:nth-child(2){background:#fff;border-top:1px solid #ddd;border-bottom:1px solid #ddd}.flag i:nth-child(3){background:#C9372C}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:99px;background:var(--gold2);font-weight:600;font-size:14px}
.icon{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;font-size:17px;flex:none}
.wrap{max-width:560px;margin:0 auto;padding:6px 16px calc(120px + env(safe-area-inset-bottom))}
.wrap.chatpad{padding-bottom:calc(230px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
.card.terra{background:var(--terra);color:#fff;border-color:var(--terra)}.card.terra small,.card.terra .mute{color:#fbe0d6}
.card.olive{background:var(--olive2);border-color:#cfdcc1}.card.gold{background:var(--gold2);border-color:#f0dcae}
.row{display:flex;align-items:center;gap:10px}.col{display:flex;flex-direction:column;gap:8px}.wrapx{flex-wrap:wrap}
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:600;cursor:pointer;background:#fff;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px}
.btn.pri{background:var(--terra);border-color:var(--terra);color:#fff}.btn.ol{background:var(--olive);border-color:var(--olive);color:#fff}
.btn.wh{background:#fff;color:var(--terra);border-color:#fff}.btn.full{width:100%}.btn.sm{min-height:36px;padding:7px 12px;font-size:14px;border-radius:11px}
.btn:disabled{opacity:.5}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 13px;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.sugs .chip{flex:none;white-space:nowrap}.seg button{white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.say{border:0;background:var(--olive2);color:var(--olive);width:38px;height:38px;border-radius:12px;cursor:pointer;font-size:16px;flex:none;display:grid;place-items:center}
.say.slow{background:var(--gold2);color:#8a5d0b}
.say.save{background:var(--terra2);color:var(--terra)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;cursor:pointer;color:var(--mute);font-size:11.5px;font-weight:600;border-radius:12px}
.tab b{font-size:20px;line-height:1}.tab.on{color:var(--terra);background:var(--terra2)}
.tab span small{display:block;font-size:9.5px;font-weight:500;color:inherit;opacity:.8}
.bar{height:9px;border-radius:9px;background:#efe6d6;overflow:hidden}.bar i{display:block;height:100%;background:var(--olive);border-radius:9px}
.phrase{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}.phrase:first-child{border-top:0}
.phrase .t{flex:1}.it{font-weight:600;font-size:17px}.en{color:var(--mute);font-size:14.5px}.note{font-size:13px;color:#8a5d0b;background:var(--gold2);border-radius:8px;padding:3px 8px;display:inline-block;margin-top:4px}
.stage{margin-top:22px}.stage h2{display:flex;align-items:baseline;gap:8px}
.unit{display:flex;gap:12px;align-items:center;padding:13px;border:1px solid var(--line);border-radius:16px;background:#fff;margin:8px 0;cursor:pointer;width:100%;text-align:left}
.num{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:700;background:var(--terra2);color:var(--terra);flex:none;font-family:Fraunces,serif}
.unit.done .num{background:var(--olive);color:#fff}.unit.next{border-color:var(--terra);box-shadow:0 0 0 3px var(--terra2)}
textarea,input[type=text]{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff;outline:none;resize:none}
textarea:focus,input[type=text]:focus{border-color:var(--terra)}
.mic{border:0;width:46px;height:46px;border-radius:14px;background:var(--ink);color:#fff;font-size:19px;cursor:pointer;flex:none}
.mic.live{background:#d93a2b;animation:pulse 1.2s infinite}
.bigmic{width:84px;height:84px;border-radius:50%;font-size:32px;margin:6px auto;display:block}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(217,58,43,.5)}70%{box-shadow:0 0 0 14px rgba(217,58,43,0)}100%{box-shadow:0 0 0 0 rgba(217,58,43,0)}}
.kbtip{font-size:12.5px;color:var(--mute);background:#fff;border:1px dashed var(--line);border-radius:10px;padding:7px 10px;margin-top:8px}
.msgs{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.bub{max-width:88%;padding:11px 14px;border-radius:18px;background:#fff;border:1px solid var(--line)}
.bub.me{align-self:flex-end;background:var(--ink);color:#fff;border-color:var(--ink);border-bottom-right-radius:6px}
.bub.tu{align-self:flex-start;border-bottom-left-radius:6px}
.bub .tr{color:var(--mute);font-size:14px;margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}
.fix{align-self:flex-end;max-width:88%;background:var(--gold2);border:1px solid #f0dcae;border-radius:14px;padding:9px 12px;font-size:14.5px}
.praise{align-self:flex-end;font-size:13px;color:var(--olive);font-weight:600}
.wchip{font-size:13px;padding:5px 9px;border-radius:99px;background:var(--terra2);color:var(--terra);border:0;cursor:pointer;font-weight:600;margin:6px 4px 0 0}
.inputbar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));z-index:25;background:linear-gradient(to top,var(--bg) 82%,rgba(251,246,238,0));padding:14px 16px 8px}
.inputbar .in{max-width:560px;margin:0 auto}
.sugs{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}.sugs::-webkit-scrollbar{display:none}
.sug{flex:none;max-width:260px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:8px 11px;font-size:14px;cursor:pointer}
.sug small{display:block}
.dots span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--mute);margin:0 2px;animation:b 1s infinite}.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,100%{opacity:.25}50%{opacity:1}}
.opt{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.opt .it{font-size:19px}.pron{font-size:13.5px;color:var(--olive);font-weight:600;margin-top:2px}
.flash{min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer}
.flash .it{font-size:26px;font-family:Fraunces,serif}
.score{font-family:Fraunces,serif;font-size:34px;font-weight:700}
.w-ok{color:var(--olive);font-weight:600}.w-miss{color:var(--terra);font-weight:700;text-decoration:underline wavy}
.check{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.check:first-child{border-top:0}
.tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-size:14px}
.tick.on{background:var(--olive);border-color:var(--olive);color:#fff}
#overlay{position:fixed;inset:0;z-index:60;display:none;background:rgba(30,38,33,.45)}
#overlay.show{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:90vh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom))}
.sheet .in{max-width:560px;margin:0 auto}
.showbig{position:absolute;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;cursor:pointer}
.showbig .it{font-family:Fraunces,serif;font-size:clamp(32px,9vw,60px);line-height:1.15}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:70;background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.seg{display:flex;background:#efe6d6;border-radius:13px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:9px 6px;font-weight:600;cursor:pointer;font-size:14px}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scn{border:1px solid var(--line);background:#fff;border-radius:16px;padding:12px;text-align:left;cursor:pointer}
.scn b{display:block;font-size:22px;margin-bottom:4px}.scn .lv{font-size:11px;font-weight:700;color:var(--olive)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.sw{width:50px;height:30px;border-radius:30px;background:#ddd2bf;position:relative;border:0;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--olive)}.sw.on::after{left:23px}
.gram{background:var(--olive2);border-radius:14px;padding:12px 14px;font-size:15px}
details summary{cursor:pointer;font-weight:600}
.empty{text-align:center;padding:26px 10px;color:var(--mute)}
a{color:var(--terra)}
</style>
</head>
<body>
<header class="top"><div class="in">
  <div class="logo"><span class="flag"><i></i><i></i><i></i></span>Parla!</div>
  <div class="sp"></div>
  <span class="pill" id="streakPill">🔥 0</span>
  <button class="icon" data-a="settings" aria-label="Settings">⚙️</button>
</div></header>
<main class="wrap" id="main"></main>
<div id="inputbar"></div>
<nav class="tabs"><div class="in" id="tabs"></div></nav>
<div id="overlay"></div>
<div id="toast"></div>

<script>
/* ======================= CURRICULUM ======================= */
const STAGES=[
 {lvl:"A1",title:"Survive & connect",weeks:"Weeks 1–7",desc:"Sounds, greetings, numbers, ordering, shopping, getting around and uni life. Goal: handle everyday transactions in Ancona."},
 {lvl:"A2",title:"Live & work",weeks:"Weeks 8–15",desc:"Talk about your day and past, pharmacy, shopping, working in a shop, job interviews, phone calls. Goal: get a part-time job and handle it in Italian."},
 {lvl:"B1",title:"Express yourself",weeks:"Weeks 16–24",desc:"Opinions, stories, solving problems, presenting, your field (environment & risk) and sounding like a local. Goal: real conversations with confidence."}
];
const UNITS=[
{id:0,lvl:"A1",e:"🔤",title:"I suoni dell'italiano",en:"The sounds of Italian",goal:"Pronounce Italian correctly from day one.",
 grammar:"Italian is read exactly as written. Key rules: C/G are soft before E/I (ciao = 'chow', gelato = 'jeh-'), hard before A/O/U and when followed by H (che = 'keh', spaghetti). GN = 'ny', GLI = 'ly', SCI/SCE = 'sh', Z/ZZ = 'ts'. Double consonants are held longer — it changes meaning (nono = ninth, nonno = grandpa). Every vowel is pronounced clearly.",
 p:[["Ciao","Hi / Bye","CI = 'ch'"],["Che cosa?","What?","CH = 'k'"],["Gelato","Ice cream","GE = 'je'"],["Spaghetti","Spaghetti","GH = hard 'g'"],["Gnocchi","Gnocchi","GN = 'ny'"],["Famiglia","Family","GLI = 'ly'"],["Pizza","Pizza","ZZ = 'ts'"],["Nono, nonno","Ninth, grandfather","Hold the double N"],["Scusi","Excuse me (formal)","SCU = 'sku'"],["Pesce","Fish","SCE = 'sheh'"]],
 role:"You are a friendly Italian teacher doing a playful pronunciation warm-up: ask her to type or say simple words and short greetings, and react kindly.",mission:"Read 5 shop signs or menu items out loud on your way to class."},
{id:1,lvl:"A1",e:"👋",title:"Ciao! Presentarsi",en:"Introducing yourself",goal:"Greet people and introduce yourself, formally and informally.",
 grammar:"ESSERE (to be): io sono, tu sei, lei/Lei è. Name: mi chiamo… Use TU with friends/peers, LEI (formal 'you', with the 3rd-person verb) with strangers, staff, older people. Adjectives match gender: nigeriano (m) / nigeriana (f).",
 p:[["Ciao, mi chiamo Anthonia.","Hi, my name is Anthonia."],["Piacere!","Nice to meet you!"],["Sono nigeriana.","I'm Nigerian. (f)"],["Vivo ad Ancona.","I live in Ancona."],["Come stai? / Come sta?","How are you? (informal / formal)"],["Sto bene, grazie. E tu?","I'm fine, thanks. And you?"],["Non parlo bene l'italiano, ma sto imparando.","I don't speak Italian well, but I'm learning."],["Può parlare più lentamente, per favore?","Can you speak more slowly, please?"],["Buongiorno! Buonasera!","Good morning! Good evening!","Buonasera from ~5pm"]],
 role:"You are Marco, a friendly Italian classmate meeting her for the first time before a lecture at Università Politecnica delle Marche. Use 'tu'.",mission:"Introduce yourself to one classmate or neighbour in Italian."},
{id:2,lvl:"A1",e:"💶",title:"Numeri e prezzi",en:"Numbers, prices & paying",goal:"Understand prices and pay at any till.",
 grammar:"Numbers: uno, due, tre, quattro, cinque, sei, sette, otto, nove, dieci… venti, trenta, cinquanta, cento. Prices: 'dieci euro e cinquanta' (€10.50). Quanto costa? (one item) / Quanto costano? (several).",
 p:[["Quanto costa?","How much is it?"],["Quanto costano queste?","How much are these?"],["Sono dieci euro e cinquanta.","It's ten euros fifty."],["Posso pagare con la carta?","Can I pay by card?"],["Pago in contanti.","I'll pay in cash."],["Le serve una busta?","Do you need a bag?","Cashiers ask this a lot"],["No, grazie, ce l'ho.","No thanks, I have one."],["Vuole lo scontrino?","Do you want the receipt?"]],
 role:"You are a cashier at a small shop in Ancona. Tell her prices, ask about bag, card or cash, receipt. Use 'Lei'.",mission:"Pay at a shop speaking only Italian."},
{id:3,lvl:"A1",e:"☕",title:"Al bar",en:"At the café",goal:"Order drinks and snacks like a local.",
 grammar:"VORREI = I would like (polite). Articles: un caffè / un cornetto (m), una brioche (f), un'acqua (f before vowel). PRENDO = I'll have.",
 p:[["Un caffè, per favore.","An espresso, please.","'Caffè' = espresso"],["Vorrei un cappuccino e un cornetto.","I'd like a cappuccino and a croissant."],["Prendo un'acqua naturale.","I'll have a still water."],["Frizzante o naturale?","Sparkling or still?"],["Da portare via.","To take away."],["Pago alla cassa?","Do I pay at the till?","Often you pay first"],["Dov'è il bagno, per favore?","Where's the toilet, please?"],["Il conto, per favore.","The bill, please."]],
 role:"You are a barista at a busy bar in Ancona in the morning. Take her order, ask follow-up questions (sparkling or still, here or take away), tell her the total. Use 'Lei' but be warm.",mission:"Order breakfast at a bar in Ancona."},
{id:4,lvl:"A1",e:"🛒",title:"Supermercato e mercato",en:"Supermarket & market",goal:"Find things, ask for amounts, and get through checkout.",
 grammar:"'Some' = del/della/dei/delle (del pane, della frutta). Amounts: un etto = 100 g, mezzo chilo = 500 g, un chilo. Dove trovo…? = Where do I find…?",
 p:[["Scusi, dove trovo il latte?","Excuse me, where can I find milk?"],["È in fondo, a destra.","It's at the back, on the right."],["Vorrei mezzo chilo di pomodori.","I'd like half a kilo of tomatoes."],["Due etti di prosciutto, per favore.","200 grams of ham, please."],["Devo pesare la frutta?","Do I have to weigh the fruit?","You weigh fruit yourself, with gloves"],["Ha la tessera?","Do you have the loyalty card?"],["È in offerta?","Is it on offer?"],["Altro? — Basta così, grazie.","Anything else? — That's all, thanks."]],
 role:"You are a supermarket employee and then the deli-counter worker at a Conad in Ancona. Help her find products, serve her at the counter (etti, chili), ask 'Altro?'. Use 'Lei'.",mission:"Ask a staff member where something is, and buy something at the deli counter."},
{id:5,lvl:"A1",e:"🚌",title:"Muoversi ad Ancona",en:"Getting around",goal:"Buy tickets, catch buses and trains, follow directions.",
 grammar:"ANDARE (to go): vado, vai, va. C'è…? = Is there…? Dov'è…? = Where is…? Directions: a destra (right), a sinistra (left), sempre dritto (straight on).",
 p:[["Scusi, dov'è la fermata dell'autobus?","Excuse me, where's the bus stop?"],["Quale autobus va in centro?","Which bus goes to the centre?"],["Un biglietto per Pesaro, per favore.","A ticket to Pesaro, please."],["Andata e ritorno.","Return ticket."],["A che ora parte il treno?","What time does the train leave?"],["Da quale binario?","From which platform?"],["Devo scendere qui?","Do I get off here?"],["Sempre dritto, poi a sinistra.","Straight on, then left."]],
 role:"You are a ticket clerk at Ancona station, then a helpful passer-by giving directions. Use 'Lei'.",mission:"Buy a bus or train ticket at the counter, in Italian."},
{id:6,lvl:"A1",e:"🎓",title:"All'università",en:"University life",goal:"Manage classes, offices and classmates.",
 grammar:"Regular -ARE verbs: studiare → studio, studi, studia, studiamo. AVERE (to have): ho, hai, ha. Non ho capito = I didn't understand.",
 p:[["Faccio un master in gestione dei rischi ambientali.","I'm doing a master's in environmental risk management."],["Dov'è la segreteria studenti?","Where's the student office?"],["A che ora inizia la lezione?","What time does the class start?"],["Ho una domanda.","I have a question."],["Non ho capito, può ripetere?","I didn't understand, can you repeat?"],["Mi mandi gli appunti?","Can you send me the notes? (informal)"],["Ci vediamo in biblioteca.","See you in the library."],["Quando è l'esame?","When is the exam?"]],
 role:"You are Sara, an Italian classmate in her master's programme at UNIVPM, chatting after class about lessons, notes and the exam. Use 'tu'.",mission:"Ask a classmate or the segreteria one question in Italian."},
{id:7,lvl:"A2",e:"⏰",title:"La mia giornata",en:"My daily routine",goal:"Describe your day and habits.",
 grammar:"Reflexive verbs: mi sveglio (I wake up), mi preparo, mi riposo. Time: alle sette (at 7), Che ore sono? Sono le tre e mezza. Di solito = usually.",
 p:[["Mi sveglio alle sette.","I wake up at seven."],["Faccio colazione e poi vado a lezione.","I have breakfast and then go to class."],["Il pomeriggio studio in biblioteca.","In the afternoon I study in the library."],["La sera cucino e chiamo la mia famiglia.","In the evening I cook and call my family."],["Di solito vado a letto a mezzanotte.","I usually go to bed at midnight."],["Che ore sono? Sono le tre e mezza.","What time is it? Half past three."],["Nel fine settimana mi riposo.","At the weekend I rest."]],
 role:"You are a curious Italian friend asking her about her typical day, habits and weekends. Use 'tu'.",mission:"Describe your day out loud in 5 sentences."},
{id:8,lvl:"A2",e:"💊",title:"Farmacia e medico",en:"Pharmacy & doctor",goal:"Explain how you feel and get what you need.",
 grammar:"Ho mal di testa / di gola / di pancia. Mi fa male (one thing) / mi fanno male (several). Ho la febbre. Allergic: sono allergica a…",
 p:[["Ho mal di testa.","I have a headache."],["Ho la febbre e la tosse.","I have a fever and a cough."],["Mi fa male la gola.","My throat hurts."],["Ha qualcosa per il raffreddore?","Do you have something for a cold?"],["Serve la ricetta?","Do I need a prescription?"],["Vorrei prenotare una visita.","I'd like to book an appointment."],["Quante volte al giorno?","How many times a day?"],["Sono allergica alla penicillina.","I'm allergic to penicillin. (example)"]],
 role:"You are a pharmacist in Ancona. Ask about symptoms, suggest something simple, explain how often to take it. Use 'Lei'.",mission:"Find your nearest farmacia and note its opening hours."},

const dayStr=d=>{d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const defS=()=>({v:1,name:"Anthonia",level:"A1",rate:1,autoplay:true,immersion:false,xp:0,streak:0,lastDay:"",days:{},units:{},quizzes:[],voiceMode:false,autoAnswer:false,helpPrefs:"I usually pay by card. I don't have the loyalty card (tessera). I have my own bag. I don't need the receipt.",updatedAt:0});
const LS={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let S=Object.assign(defS(),LS.get("parla_progress")||{});
let W=LS.get("parla_words")||{list:[],updatedAt:0};if(!Array.isArray(W.list))W={list:[],updatedAt:0};
let db=null,uid=null,cloud="local",ai=null,tts=null,dict=null;
const remote={progress:{w:false,d:false},words:{w:false,d:false}};const wt={};
function persist(which){const o=which==="progress"?S:W;o.updatedAt=Date.now();LS.set("parla_"+which,o);if(db&&uid){clearTimeout(wt[which]);wt[which]=setTimeout(()=>flush(which),1200)}}
async function flush(which){const r=remote[which];if(!db)return;if(r.w){r.d=true;return}r.w=true;
 try{await db.doc("data/users/"+uid+"/"+which).set(JSON.parse(JSON.stringify(which==="progress"?S:W)))}catch(e){if(e&&e.code==="invalid_argument"){db=null;cloud="local"}else if(e&&e.code==="unavailable"){r.d=true}}
 r.w=false;if(r.d){r.d=false;setTimeout(()=>flush(which),800)}}
function subscribe(which){const ref=db.doc("data/users/"+uid+"/"+which);let settled=false;
 const timer=setTimeout(()=>{if(!settled){cloud="local"}},10000);
 ref.onSnapshot(snap=>{if(snap.metadata.hasPendingWrites)return;
  const local=which==="progress"?S:W;
  if(snap.exists){const d=JSON.parse(JSON.stringify(snap.data()||{}));
   if((d.updatedAt||0)>(local.updatedAt||0)){if(which==="progress")S=Object.assign(defS(),d);else W={list:Array.isArray(d.list)?d.list:[],updatedAt:d.updatedAt};LS.set("parla_"+which,which==="progress"?S:W);softRender()}
   else if(!snap.metadata.fromCache&&!settled&&(d.updatedAt||0)<(local.updatedAt||0))flush(which);
  }else if(!snap.metadata.fromCache&&!settled&&(local.updatedAt||0)>0)flush(which);
  if(!snap.metadata.fromCache){settled=true;clearTimeout(timer);cloud="cloud"}
 },()=>{clearTimeout(timer);cloud="local"});
}
function activity(kind,xp){const t=dayStr();if(S.lastDay!==t){const y=new Date();y.setDate(y.getDate()-1);S.streak=S.lastDay===dayStr(y)?S.streak+1:1;S.lastDay=t}
 S.days[t]=S.days[t]||{xp:0};S.days[t][kind]=true;S.days[t].xp+=xp||0;S.xp+=xp||0;
 const keys=Object.keys(S.days).sort();while(keys.length>60)delete S.days[keys.shift()];
 persist("progress");updatePill()}
const today=()=>S.days[dayStr()]||{xp:0};
function liveStreak(){if(!S.lastDay)return 0;const y=new Date();y.setDate(y.getDate()-1);return(S.lastDay===dayStr()||S.lastDay===dayStr(y))?S.streak:0}
function updatePill(){document.getElementById("streakPill").textContent="🔥 "+liveStreak()}

const nkey=s=>norm(s).replace(/ /g,"");
function addWord(it,en){it=(it||"").trim();en=(en||"").trim();if(!it)return;if(W.list.some(w=>nkey(w.it)===nkey(it))){toast("Already in your words ⭐");return}

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const L=(it,en)=>S.immersion?esc(it):esc(it)+' <small>· '+esc(en)+'</small>';
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),2200)}
function norm(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[’'`]/g," ").replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ").trim()}
function compare(ans,target){const tt=target.split(/\s+/).filter(Boolean),tk=tt.map(nkey),ak=String(ans).split(/\s+/).map(nkey).filter(Boolean);
 const n=tk.length,m=ak.length,dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
 for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=tk[i]&&tk[i]===ak[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
 const hit=new Array(n).fill(false);let i=0,j=0;while(i<n&&j<m){if(tk[i]&&tk[i]===ak[j]){hit[i]=true;i++;j++}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++}
 tk.forEach((k,x)=>{if(!k)hit[x]=true});
 const real=tk.filter(Boolean).length;const score=real+m?Math.round(200*dp[0][0]/(real+m)):0;
 return{score,html:tt.map((w,x)=>'<span class="'+(hit[x]?"w-ok":"w-miss")+'">'+esc(w)+"</span>").join(" ")}}
const sayBtns=(t,save)=>'<button class="say" data-a="say" data-t="'+esc(t)+'" aria-label="Play">🔊</button><button class="say slow" data-a="say" data-slow="1" data-t="'+esc(t)+'" aria-label="Play slowly">🐢</button>'+(save?'<button class="say save" data-a="save" data-it="'+esc(t)+'" data-en="'+esc(save)+'" aria-label="Save word">⭐</button>':"");

let itVoice=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();itVoice=vs.find(v=>/it[-_]IT/i.test(v.lang)&&/google|alice|federica|luca|elsa|natural/i.test(v.name))||vs.find(v=>/^it/i.test(v.lang))||null}catch(e){}}
if("speechSynthesis" in window){pickVoice();try{speechSynthesis.onvoiceschanged=pickVoice}catch(e){}}
function browserSpeak(text,slow){if(!("speechSynthesis" in window)){toast("Audio isn't available here");return}
 try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="it-IT";if(itVoice)u.voice=itVoice;u.rate=(slow?.7:.95)*(S.rate||1);speechSynthesis.speak(u)}catch(e){toast("Audio isn't available here")}}
function speak(text,slow){if(!text)return;
 const NT=NP("TextToSpeech");if(NT&&!tts){try{NT.stop().catch(()=>{})}catch(e){}NT.speak({text,lang:"it-IT",rate:(slow?.7:1)*(S.rate||1),pitch:1,volume:1}).catch(()=>toast("Install Italian voice: Settings → Text-to-speech"));return}
 if(tts){const rate=Math.max(.7,Math.min(1.5,(slow?.72:1)*(S.rate||1)));
  tts.speak(text,{language:"it",rate}).catch(e=>{const c=e&&e.code;if(c==="not_granted"){tts=null;browserSpeak(text,slow)}else if(c==="busy"){toast("Stop the mic first, then play")}else if(c&&!/stop|replac|interrupt|cancel/i.test(c)&&c!=="rate_limited"){browserSpeak(text,slow)}});
 }else browserSpeak(text,slow)}

function parseLoose(t){t=String(t||"");const a=t.indexOf("{"),b=t.lastIndexOf("}");if(a<0||b<a)throw{code:"bad_json"};return JSON.parse(t.slice(a,b+1))}
async function askJSON(input,tier){if(!ai)throw{code:"no_ai"};const opts={modelTier:tier||"default",cache:false};
 if(typeof ai.json==="function"){try{const v=await ai.json(input,opts);if(v&&typeof v==="object")return v}catch(e){if(e&&(e.code==="not_granted"||e.code==="rate_limited"))throw e}}

let quiz=null,qTimer=null;
function stopQuizTimer(){if(qTimer){clearInterval(qTimer);qTimer=null}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function weekUnits(){const cut=Date.now()-7*864e5;const ok=d=>d&&new Date(d+"T12:00:00").getTime()>=cut;
 const us=UNITS.filter(u=>{const s=S.units[u.id]||{};return ok(s.seen)||ok(s.doneDay)});
 if(us.length)return us;const nu=nextUnit();return UNITS.filter(u=>u.id<=nu.id).slice(-2)}
const ALL=UNITS.flatMap(u=>u.p.map(p=>({it:p[0],en:p[1],lvl:u.lvl})));
const cleanW=w=>w.replace(/[.,!?;:…—«»"()]/g,"");
function buildQuiz(){const us=weekUnits();const cut=Date.now()-7*864e5;
 let pool=us.flatMap(u=>u.p.map(p=>({it:p[0],en:p[1],lvl:u.lvl})));
 W.list.filter(w=>(w.added||0)>=cut&&w.en).forEach(w=>pool.push({it:w.it,en:w.en}));
 const seen=new Set();pool=pool.filter(x=>{const k=nkey(x.it);if(seen.has(k))return false;seen.add(k);return true});
 pool=shuffle(pool.filter(x=>nkey(x.it)!==nkey(x.en))).slice(0,12);
 const types=["listen","meaning","produce","gap","type","listen","produce","meaning","gap","type","listen","produce"];
 const others=f=>{const c=ALL.filter(x=>nkey(x.it)!==nkey(f.it)&&nkey(x.en)!==nkey(f.en)&&nkey(x.it)!==nkey(x.en));const same=shuffle(c.filter(x=>x.lvl===(f.lvl||"A1")));return(same.length>=3?same:shuffle(c)).slice(0,3)};
 const qs=pool.map((f,i)=>{let t=types[i%types.length];
  if(t==="gap"){const ws=f.it.split(/\s+/).map(cleanW).filter(w=>w.length>=3&&!/'/.test(w));if(!ws.length)t="meaning";else{const w=ws[Math.floor(Math.random()*ws.length)];
   const pool2=shuffle([...new Set(ALL.flatMap(x=>x.it.split(/\s+/).map(cleanW)).filter(x=>x.length>=3&&!/'/.test(x)&&x.toLowerCase()!==w.toLowerCase()))]).slice(0,3);
   const re=new RegExp("(^|\\s)"+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(?=[\\s.,!?;:…]|$)");
   return{t,f,shown:f.it.replace(re,"$1____"),opts:shuffle([w,...pool2]),ans:w,secs:20}}}
  if(t==="listen"||t==="meaning")return{t,f,opts:shuffle([f.en,...others(f).map(x=>x.en)]),ans:f.en,secs:t==="listen"?25:20};
  if(t==="produce")return{t,f,opts:shuffle([f.it,...others(f).map(x=>x.it)]),ans:f.it,secs:20};
  return{t:"type",f,secs:40}});
 return{qs,i:0,score:0,picked:null,res:null,left:0,started:false,units:us.map(u=>u.id)}}
function startQ(){const q=quiz.qs[quiz.i];quiz.picked=null;quiz.res=null;quiz.left=q.secs;quiz.deadline=Date.now()+q.secs*1000;
 stopQuizTimer();qTimer=setInterval(()=>{const left=Math.max(0,(quiz.deadline-Date.now())/1000);quiz.left=left;const b=document.getElementById("qbar");if(b)b.style.width=(100*left/q.secs)+"%";const n=document.getElementById("qsec");if(n)n.textContent=Math.ceil(left)+"s";if(left<=0){stopQuizTimer();answerQ(null)}},200);
 render();if(q.t==="listen")speak(q.f.it)}
function answerQ(v){const q=quiz.qs[quiz.i];if(quiz.res)return;stopQuizTimer();let ok=false,score=0;
 if(q.t==="type"){if(v){const c=compare(v,q.f.it);score=c.score;ok=c.score>=70;quiz.res={ok,typed:v,html:c.html,score}}else quiz.res={ok:false,typed:"",html:esc(q.f.it),score:0}}
 else{ok=v!=null&&v===q.ans;quiz.picked=v;quiz.res={ok}}
 if(listening&&dict)dict.stop().catch(()=>{});
 q.ok=ok;if(ok)quiz.score++;render();speak(q.f.it)}
function finishQuiz(){stopQuizTimer();const n=quiz.qs.length,pct=Math.round(100*quiz.score/n);quiz.done=true;
 S.quizzes=(S.quizzes||[]).concat([{d:dayStr(),s:quiz.score,n,pct}]).slice(-20);activity("quiz",20+quiz.score*2);render()}
function vQuiz(){if(!quiz)quiz=buildQuiz();const z=quiz;
 if(!z.started){const names=z.units.map(id=>U(id)).map(u=>u.e+" "+u.title).join(" · ");const past=(S.quizzes||[]).slice(-4).reverse();
  return`<button class="btn sm" style="margin-top:12px" data-a="go" data-v="today">‹ Today</button>
  <div style="margin-top:12px"><h1>⏱️ ${L("Test della settimana","Weekly test")}</h1><div class="mute" style="margin-top:4px">${z.qs.length} timed questions on everything you studied in the last 7 days.</div></div>
  <div class="card"><small>COVERS</small><div style="margin-top:4px;font-weight:600">${esc(names)}</div><div class="mute" style="font-size:13.5px;margin-top:4px">+ words you saved this week</div></div>
  <div class="card"><div class="col" style="font-size:15px"><div>🎧 <b>Listening</b> — hear it, pick the meaning (no text!)</div><div>📖 <b>Meaning</b> — read Italian, pick the English</div><div>🗣️ <b>Say it</b> — pick or type the right Italian</div><div>🧩 <b>Fill the gap</b> — choose the missing word</div><div class="mute" style="font-size:13.5px">20–40 seconds per question. Answers are read out after each one.</div></div></div>
  <button class="btn pri full" data-a="qstart">Start the test</button>
  ${past.length?`<div class="card"><small>PAST SCORES</small>${past.map(p=>`<div class="row" style="margin-top:8px"><span style="flex:1">${esc(p.d)}</span><b>${p.s}/${p.n}</b><span class="mute">${p.pct}%</span></div>`).join("")}</div>`:""}`}
 if(z.done){const n=z.qs.length,pct=Math.round(100*z.score/n),wrong=z.qs.filter(q=>!q.ok);
  return`<div class="card" style="text-align:center;margin-top:18px"><div style="font-size:44px">${pct>=80?"🏆":pct>=60?"👏":"💪"}</div><h2>${pct>=80?"Bravissima!":pct>=60?"Molto bene!":"Continua così!"}</h2><div class="score" style="margin:8px 0">${z.score}/${n}</div><div class="mute">${pct}% · +${20+z.score*2} XP</div></div>
  ${wrong.length?`<div class="card"><div class="row"><b style="flex:1">Review these</b><button class="btn sm ol" data-a="qsaveall">⭐ Save all</button></div>${wrong.map(q=>`<div class="phrase"><div class="t"><div class="it" style="font-size:16px">${esc(q.f.it)}</div><div class="en">${esc(q.f.en)}</div></div>${sayBtns(q.f.it,q.f.en)}</div>`).join("")}</div>`:""}
  <div class="col"><button class="btn pri" data-a="qagain">↺ New test</button><button class="btn" data-a="go" data-v="today">Done</button></div>`}
 const q=z.qs[z.i],r=z.res;
 const head=`<div class="row" style="margin-top:12px"><button class="btn sm" data-a="qquit">✕</button><div class="sp"></div><span class="mute">${z.i+1} / ${z.qs.length}</span><span class="pill" style="margin-left:8px">✓ ${z.score}</span></div>
 <div class="row" style="margin-top:10px"><div class="bar" style="flex:1"><i id="qbar" style="width:${r?0:100*z.left/q.secs}%;background:${r?"#ccc":"var(--terra)"};transition:width .2s linear"></i></div><b id="qsec" style="width:34px;text-align:right">${r?"":Math.ceil(z.left)+"s"}</b></div>`;
 let body="";const lab={listen:"🎧 Listen — what does it mean?",meaning:"📖 What does it mean?",produce:"🗣️ How do you say it in Italian?",gap:"🧩 Fill the gap",type:"✍️ Say or type it in Italian"}[q.t];
 if(q.t==="listen")body=`<div style="text-align:center;margin:10px 0 6px"><button class="mic bigmic" style="background:var(--olive)" data-a="say" data-t="${esc(q.f.it)}">▶</button><button class="btn sm" data-a="say" data-slow="1" data-t="${esc(q.f.it)}">🐢 Slower</button>${r?`<div class="it" style="margin-top:10px">${esc(q.f.it)}</div>`:""}</div>`;
 if(q.t==="meaning")body=`<h2 style="margin:10px 0">${esc(q.f.it)}</h2>`;
 if(q.t==="produce")body=`<h2 style="margin:10px 0">${esc(q.f.en)}</h2>`;
 if(q.t==="gap")body=`<h2 style="margin:10px 0">${esc(q.shown)}</h2><div class="mute">${esc(q.f.en)}</div>`;
 if(q.t==="type")body=`<h2 style="margin:10px 0">${esc(q.f.en)}</h2>${r?`<div class="row"><div class="score" style="font-size:26px;color:${r.ok?"var(--olive)":"var(--terra)"}">${r.score}%</div></div><div class="mute" style="font-size:14px">You: “${esc(r.typed||"—")}”</div><div style="font-size:18px;margin-top:6px">${r.html}</div>`:`<div class="row"><textarea id="quizIn" rows="2" data-in placeholder="In italiano…">${esc(inputs.quizIn||"")}</textarea>${micBtn("quizIn",false,"qtype")}</div><button class="btn pri full" style="margin-top:10px" data-a="qtype">Check</button>`}`;
 const opts=q.opts?`<div class="col" style="margin-top:12px">${q.opts.map(o=>{let st="";if(r){if(o===q.ans)st="background:var(--olive);color:#fff;border-color:var(--olive)";else if(o===z.picked)st="background:var(--terra2);border-color:var(--terra);color:var(--terra)"}return`<button class="btn full" style="justify-content:flex-start;text-align:left;${st}" data-a="qpick" data-v="${esc(o)}" ${r?"disabled":""}>${esc(o)}</button>`}).join("")}</div>`:"";
 const fb=r?`<div class="card ${r.ok?"olive":"gold"}" style="margin-top:12px"><b>${r.ok?"✅ Giusto!":z.picked===null&&q.t!=="type"?"⏰ Time's up":"❌ Not quite"}</b><div class="row" style="margin-top:6px"><div style="flex:1"><div class="it" style="font-size:16px">${esc(q.f.it)}</div><div class="en">${esc(q.f.en)}</div></div>${sayBtns(q.f.it,q.f.en)}</div></div><button class="btn pri full" data-a="qnext">${z.i+1<z.qs.length?"Next ›":"See my score"}</button>`:"";
 return head+`<div class="card"><small>${lab}</small>${body}${opts}</div>`+fb}

async function startChat(scn){if(listening&&dict)dict.stop().catch(()=>{});
 chat={scn,e:scn.e||"🗣️",title:scn.title,msgs:[],busy:true,err:"",history:[],showSug:false};view="talk";
 try{history.replaceState(null,"","#talk")}catch(e){}render();
 const sys=`You are an Italian conversation partner and coach for ${who()}. Her level: ${LVL[S.level]}.
ROLE-PLAY: ${scn.role}
Rules:
- Stay in role. Speak natural, real-life Italian as people in Ancona would, simplified to her level.
- Each reply: 1–3 short sentences, usually ending with a question or prompt so the conversation continues.
- If she writes English or mixes languages, reply in Italian and give the Italian for what she meant in "correction".
- Correct only real mistakes (grammar, wrong word, gender/agreement, tu/Lei register). Ignore missing accents, capitals and small typos from voice typing. If her message is fine, "correction" is null and "praise" is a short Italian praise (2–4 words).
Return ONLY a JSON object, no markdown, in this exact shape:
{"reply":"your Italian reply","en":"English translation of your reply","correction":null,"praise":"","suggestions":[{"it":"possible reply she could say next, at her level","en":"English"},{"it":"","en":""},{"it":"","en":""}],"words":[{"it":"useful word or short phrase from your reply","en":"English"}]}
"correction" when needed is {"better":"natural correct Italian version of her last message","why":"one short English explanation"}. "words": 0–3 items.`;
 chat.history=[{role:"user",content:sys+"\n\nStart the conversation now, in role (she hasn't spoken yet, so correction is null)."}];
 await chatTurn()}
async function chatTurn(){const c=chat;c.busy=true;c.err="";render();
 try{const r=await askJSON(c.history,"default");if(chat!==c)return;
  const lastMe=[...c.msgs].reverse().find(m=>m.role==="me");
  if(lastMe&&c.msgs[c.msgs.length-1]===lastMe){if(r.correction&&r.correction.better&&nkey(r.correction.better)!==nkey(lastMe.it))lastMe.fix=r.correction;else if(r.praise)lastMe.praise=r.praise}
  const msg={role:"tu",it:r.reply||"…",en:r.en||"",words:(r.words||[]).filter(w=>w&&w.it).slice(0,3),suggestions:(r.suggestions||[]).filter(s=>s&&s.it).slice(0,3),show:false};
  c.msgs.push(msg);c.history.push({role:"assistant",content:JSON.stringify(r)});c.busy=false;c.showSug=false;render();
  if(S.autoplay||S.voiceMode)speak(msg.it);
 }catch(e){if(chat!==c)return;c.busy=false;c.err=aiErr(e);render()}}
function sendChat(forced){const el=$("#chatIn");const t=(forced||(el&&el.value)||"").trim();if(!t||!chat||chat.busy)return;if(listening&&dict)dict.stop().catch(()=>{});
 chat.msgs.push({role:"me",it:t});chat.history.push({role:"user",content:`She says: "${t}"\nReply in role with the JSON object only.`});
 inputs.chatIn="";dictBase="";const n=chat.msgs.filter(m=>m.role==="me").length;activity("chat",n<=10?3:1);chatTurn()}

async function helpGo(){const el=$("#helpIn");const t=(el&&el.value||"").trim();if(!t){toast("Type or say something first");return}if(help.busy)return;
 if(listening&&dict)dict.stop().catch(()=>{});
 const pl=(PLACES.find(p=>p[0]===help.place)||PLACES[0])[2];const mode=help.mode;
 const ctx=help.log.length?"Conversation so far:\n"+help.log.slice(-6).map(x=>(x.who==="they"?"Them: ":"Her: ")+x.it).join("\n")+"\n":"";
 help.busy=true;help.err="";help.res=null;const gen=help.gen=(help.gen||0)+1;render();hScroll();
 const prompt=mode==="heard"?`You help ${who()} understand and answer people in real time. Her Italian level: ${LVL[S.level]}. Place: ${pl}.
Her usual preferences (use them to pick the best reply): ${S.helpPrefs||"none given"}
${ctx}Someone just said this to her (from speech-to-text, so it may contain recognition errors or be partly English-spelled): "${t}"
Return ONLY JSON, no markdown:
{"heard":"the most likely intended Italian sentence, corrected","meaning":"clear natural English meaning","simple":"the same idea in very simple Italian (or empty if already simple)","replies":[{"it":"short natural reply she can say right now","en":"English meaning","say":"easy pronunciation guide for an English speaker, hyphenated syllables, stressed syllable in CAPS"}],"tip":"one short practical or cultural tip for this moment, or empty","best":0}
"best" is the index of the reply that best fits her preferences and the conversation so far. Give exactly 3 replies covering the most likely answers (e.g. yes / no / please repeat, or the most useful options). Use Lei with staff and strangers.`
 :`You help ${who()} say things in Italian in real life, right now. Her level: ${LVL[S.level]}. Place: ${pl}.
${ctx}She wants to say (in English or broken Italian): "${t}"
Return ONLY JSON, no markdown:
{"options":[{"it":"natural Italian sentence","en":"back-translation in English","say":"easy pronunciation guide for an English speaker, hyphenated syllables, stressed syllable in CAPS","note":"when to use it, e.g. polite / casual"}],"listen_for":[{"it":"something they will likely answer","en":"English"}],"tip":"one short practical or cultural tip, or empty"}
Give 2–3 options; the first is the best polite version for staff/strangers (Lei). Give 2–3 likely answers in listen_for. Keep everything short and speakable.`;
 try{const r=await askJSON(prompt,"default");if(gen!==help.gen)return;help.res={kind:mode,data:r};help.busy=false;inputs.helpIn="";dictBase="";activity("help",5);
  if(mode==="heard"&&r.heard)help.log.push({who:"they",it:r.heard,en:r.meaning});
  let auto=null;if(mode==="heard"&&S.autoAnswer){const reps=r.replies||[];const o=reps[+r.best]||reps[0];if(o&&o.it)auto=o.it}
  else if(mode==="want"){const o=r.options&&r.options[0];if(o&&o.it&&(S.autoplay||S.autoAnswer))auto=o.it}
  if(auto){help.log.push({who:"me",it:auto});help.res.spoke=auto}
  render();hScroll();if(auto)speak(auto);
 }catch(e){if(gen!==help.gen)return;help.busy=false;help.err=aiErr(e);render();hScroll()}}

function makeWebDictation(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return null;
 let rec=null,cbP=()=>{},cbF=()=>{},cbS=()=>{},stopping=null,reason="stopped";
 return{onPartial(f){cbP=f},onFinal(f){cbF=f},onState(f){cbS=f},
  start(){return new Promise((res,rej)=>{try{rec=new SR();rec.lang=dictLang;rec.continuous=true;rec.interimResults=true;reason="stopped";
   rec.onresult=e=>{let interim="";for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)cbF({text:r[0].transcript.trim()});else interim+=r[0].transcript}cbP({text:interim})};
   rec.onerror=e=>{if(e.error==="not-allowed"||e.error==="service-not-allowed"){reason="not_granted";rej({code:"not_granted"})}else reason=e.error||"error"};
   rec.onstart=()=>{cbS({state:"listening"});res()};
   rec.onend=()=>{cbP({text:""});cbS({state:"idle",reason});if(stopping){stopping();stopping=null}};
   rec.start()}catch(e){rej({code:"dismissed"})}})},
  stop(){return new Promise(r=>{if(!rec)return r();stopping=r;try{rec.stop()}catch(e){r()}})}}}
const NATIVE=!!(window.Capacitor&&typeof window.Capacitor.isNativePlatform==="function"&&window.Capacitor.isNativePlatform());
const _np={};
function NP(name){if(!NATIVE)return null;if(name in _np)return _np[name];const cap=window.Capacitor;let p=null;
 if(cap.Plugins&&cap.Plugins[name])p=cap.Plugins[name];
 else if(typeof cap.nativePromise==="function"&&(!cap.PluginHeaders||cap.PluginHeaders.some(h=>h.name===name))){
  p=new Proxy({},{get(_,m){if(m==="then")return undefined;
   if(m==="addListener")return(ev,cb)=>{let id=null;try{id=cap.nativeCallback(name,"addListener",{eventName:ev},cb)}catch(e){}return Promise.resolve({remove:()=>cap.nativePromise(name,"removeListener",{eventName:ev,callbackId:id}).catch(()=>{})})};
   return o=>cap.nativePromise(name,String(m),o||{})}})}
 return(_np[name]=p)}
const withTimeout=(pr,ms)=>Promise.race([pr,new Promise((_,rej)=>setTimeout(()=>rej({code:"timeout"}),ms))]);
function makeNativeDictation(){const P=NP("SpeechRecognition");if(!P)return null;
 let cbP=()=>{},cbF=()=>{},cbS=()=>{},cur="",active=false;
 const end=()=>{if(!active)return;active=false;if(cur){cbF({text:cur});cur=""}cbP({text:""});cbS({state:"idle",reason:"stopped"})};
 try{P.addListener("partialResults",d=>{cur=(d&&d.matches&&d.matches[0])||cur;if(active)cbP({text:cur})});
  P.addListener("listeningState",d=>{if(d&&d.status==="stopped")end()})}catch(e){}
 return{onPartial(f){cbP=f},onFinal(f){cbF=f},onState(f){cbS=f},
  async start(){let p=await withTimeout(P.checkPermissions(),4000).catch(()=>({}));if(!p||p.speechRecognition!=="granted"){p=await withTimeout(P.requestPermissions(),30000).catch(()=>({}));if(!p||p.speechRecognition!=="granted")throw{code:"not_granted"}}
   cur="";active=true;cbS({state:"listening"});
   P.start({language:dictLang,partialResults:true,popup:false,maxResults:1}).then(r=>{if(r&&r.matches&&r.matches[0])cur=r.matches[0]}).catch(()=>end())},
  async stop(){try{await P.stop()}catch(e){}setTimeout(end,700)}}}

function gemVer(n){const m=n.match(/^gemini-(\d+(?:\.\d+)?)-flash$/);return m?parseFloat(m[1]):-1}
async function setupAI(cfg){if(!cfg.key)return cfg;
 if(cfg.provider==="claude"){const r=await tfetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":cfg.key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-5-5",max_tokens:10,messages:[{role:"user",content:"Say ok"}]})});
  if(!r.ok){const j=await r.json().catch(()=>({}));throw{code:r.status===401?"bad_key":"api",message:j.error&&j.error.message}}cfg.model="claude-sonnet-5-5";return cfg}
 const r=await tfetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=1000&key="+encodeURIComponent(cfg.key));const j=await r.json().catch(()=>({}));
 if(!r.ok)throw{code:(r.status===400||r.status===403)?"bad_key":"api",message:j.error&&j.error.message};
 const names=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes("generateContent")).map(m=>m.name.replace(/^models\//,""));
 const best=names.filter(n=>gemVer(n)>0).sort((a,b)=>gemVer(b)-gemVer(a))[0]||(names.includes("gemini-flash-latest")?"gemini-flash-latest":names.find(n=>/flash/.test(n)&&!/lite|tts|live|image|audio|embed/.test(n)));
 if(!best)throw{code:"api",message:"No suitable Gemini model on this key"};cfg.model=best;return cfg}
function tfetch(url,o,ms){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms||30000);return fetch(url,Object.assign({},o,{signal:c.signal})).catch(e=>{throw{code:e&&e.name==="AbortError"?"slow":"net"}}).finally(()=>clearTimeout(t))}
function thinkCfg(model){const v=parseFloat((model.match(/gemini-(\d+(?:\.\d+)?)/)||[])[1]||"0");return v>=3?{thinkingLevel:"low"}:v>=2.5?{thinkingBudget:0}:null}
async function webAI(input,opts){let cfg=KEYS.p;if(!cfg.key)throw{code:"no_key"};
 if(!cfg.model){cfg=await setupAI(cfg);LS.set("parla_ai",cfg)}
 const msgs=typeof input==="string"?[{role:"user",content:input}]:input;
 if(cfg.provider==="claude"){const model=cfg.model||"claude-sonnet-5-5";
  const r=await tfetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":cfg.key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model,max_tokens:1500,messages:msgs})},40000);
  const j=await r.json().catch(()=>({}));if(!r.ok)throw{code:r.status===429?"rate_limited":r.status===401?"bad_key":"api",message:j.error&&j.error.message};
  return{text:(j.content||[]).map(c=>c.text||"").join("")}}
 const contents=msgs.map(m=>({role:m.role==="assistant"?"model":"user",parts:[{text:m.content}]}));
 const tryModels=[cfg.model].concat(GEM_MODELS.filter(m=>m!==cfg.model));let last=null;
 for(const model of tryModels){if(!model)continue;const gc={responseMimeType:"application/json",temperature:.8};const tc=cfg.noThink?null:thinkCfg(model);if(tc)gc.thinkingConfig=tc;
  const call=g=>tfetch("https://generativelanguage.googleapis.com/v1beta/models/"+model+":generateContent?key="+encodeURIComponent(cfg.key),{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({contents,generationConfig:g})},40000);
  let r=await call(gc);let j=await r.json().catch(()=>({}));
  if(!r.ok&&r.status===400&&gc.thinkingConfig&&/think/i.test(JSON.stringify(j))){delete gc.thinkingConfig;cfg.noThink=true;LS.set("parla_ai",cfg);r=await call(gc);j=await r.json().catch(()=>({}))}
  if(r.ok){if(cfg.model!==model){cfg.model=model;LS.set("parla_ai",cfg)}return{text:((j.candidates||[])[0]?.content?.parts||[]).map(p=>p.text||"").join("")}}
  last={code:r.status===429?"rate_limited":(r.status===400||r.status===403)&&/key/i.test(JSON.stringify(j))?"bad_key":"api",message:j.error&&j.error.message};
  if(r.status!==404)break}
 throw last||{code:"api"}}

(async()=>{const use=n=>(window.claude&&typeof window.claude.use==="function")?window.claude.use(n).catch(()=>null):Promise.resolve(null);
 const [d,u,a,t,dc]=STANDALONE?[null,null,null,null,null]:await Promise.all(["db","user","sample","tts","dictation"].map(use));
 ai=a||null;tts=t||null;dict=dc||null;
 if(STANDALONE){dict=NATIVE?makeNativeDictation():makeWebDictation();ai=webAI}
 setupDict();
 if(d&&u){try{uid=await u.id()}catch(e){uid=null}if(uid){db=d;try{subscribe("progress");subscribe("words")}catch(e){db=null}}}
 softRender();
})();
