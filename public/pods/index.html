<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff4f7e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pods">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pods</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Pods: white, airy, in love. Her colour = rose, his = teal, hearts float behind everything.
   Layout: phone app — greeting bar, one column of soft white cards, bouncy tab bar. */
:root{
  --bg:#ffffff; --blush:#fff3f6; --blush2:#ffe4ec; --line:#f6dde5;
  --ink:#3a1f2b; --muted:#94737f; --her:#ff4f7e; --him:#22b3a3; --gold:#ffb21f; --sky:#6cc6ff;
  --display:"Fredoka", "Avenir Next Rounded", system-ui, sans-serif;
  --body:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --shadow:0 6px 24px rgba(255,79,126,.10), 0 1px 3px rgba(58,31,43,.06);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance}
h2{font-size:1.3rem} h3{font-size:1.02rem}
/* floating hearts layer */
.bgHearts{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bgHearts span{position:absolute;bottom:-40px;color:var(--blush2);animation:rise linear infinite}
.bgHearts svg{width:100%;height:100%}
@keyframes rise{from{transform:translateY(0) rotate(-10deg)}50%{transform:translateY(-55vh) rotate(10deg)}to{transform:translateY(-115vh) rotate(-10deg)}}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(env(safe-area-inset-top) + 10px) 18px 10px;background:rgba(255,255,255,.86);backdrop-filter:blur(12px)}
.brand{font-family:var(--display);font-weight:700;font-size:1.6rem;display:flex;align-items:center;gap:6px;color:var(--her)}
.brand svg{width:22px;height:22px;animation:beat 1.6s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.22)}30%{transform:scale(1)}45%{transform:scale(1.14)}}
.who{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.9rem;background:var(--blush);border:none;border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer}
.av{display:inline-block;flex:none;border-radius:50%;overflow:hidden;animation:bob 3.2s ease-in-out infinite}
.av svg{display:block;width:100%;height:100%}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(-3deg)}}
main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:8px 16px calc(112px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px}
main>*{animation:pop .5s cubic-bezier(.2,.9,.3,1.3) both}
main>*:nth-child(2){animation-delay:.05s} main>*:nth-child(3){animation-delay:.1s} main>*:nth-child(4){animation-delay:.15s} main>*:nth-child(5){animation-delay:.2s} main>*:nth-child(6){animation-delay:.25s}
@keyframes pop{from{opacity:.0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)} .small{font-size:.86rem}
.eyebrow{font-size:.74rem;text-transform:uppercase;letter-spacing:.1em;color:var(--her);font-weight:800}
.btn{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:10px 16px;cursor:pointer;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s}
.btn:active{transform:scale(.94)}
.btn.primary{background:var(--her);border-color:var(--her);color:#fff;box-shadow:0 4px 14px rgba(255,79,126,.35)}
.btn.teal{background:var(--him);border-color:var(--him);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--her)}
.btn.sm{padding:6px 12px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input[type=text],input[type=url],input[type=date],input[type=time],textarea,select{width:100%;background:var(--blush);border:1.5px solid transparent;border-radius:16px;padding:11px 14px;outline:none}
textarea{min-height:84px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--her);background:#fff}
label.f{display:flex;flex-direction:column;gap:6px;font-size:.86rem;color:var(--muted);font-weight:700}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--blush)}
.chip.her{color:var(--her);background:#ffe8ef} .chip.him{color:#108a7d;background:#dff7f3} .chip.gold{color:#a86a00;background:#fff3d6} .chip.warn{color:#c2410c;background:#ffedd5}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.dot.anthonia{background:var(--her)} .dot.ifeayomi{background:var(--him)}
.greet{display:flex;align-items:center;gap:14px;padding:6px 2px}
.greet h1{font-size:1.55rem}
.wave{display:inline-block;animation:wave 2.4s ease-in-out infinite;transform-origin:70% 70%}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(16deg)}20%,40%{transform:rotate(-8deg)}}
.hero{background:linear-gradient(135deg,#fff0f5 0%,#ffffff 50%,#eafaf8 100%);position:relative;overflow:hidden}
.hero .couple{display:flex;align-items:center;justify-content:center;gap:4px;margin:4px 0}
.hero .bridge{color:var(--her);animation:beat 1.6s ease-in-out infinite;width:30px;height:30px}
.big{font-family:var(--display);font-weight:700;font-size:4rem;line-height:.9;color:var(--her);font-variant-numeric:tabular-nums}
.center{text-align:center;align-items:center}
.clocks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.clock{background:var(--blush);border-radius:18px;padding:10px 12px}
.clock.him{background:#ecfaf7}
.clock .t{font-family:var(--display);font-size:1.6rem;font-weight:600;font-variant-numeric:tabular-nums}
.tapbtn{width:100%;border:none;border-radius:999px;padding:16px;cursor:pointer;font-weight:800;font-size:1.08rem;font-family:var(--display);
  background:linear-gradient(100deg,#ff4f7e,#ff8a9e);color:#fff;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 8px 22px rgba(255,79,126,.35);transition:transform .15s}
.tapbtn:active{transform:scale(.95)}
.tapbtn svg{width:24px;height:24px;animation:beat 1.6s ease-in-out infinite}
.bubble{display:flex;gap:10px;align-items:flex-start}
.bubble .b{background:var(--blush);border-radius:4px 18px 18px 18px;padding:10px 14px;flex:1;overflow-wrap:anywhere}
.bubble.ifeayomi .b{background:#ecfaf7}
.bubble .who2{font-size:.75rem;font-weight:800;color:var(--muted)}
.locked{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.9rem;background:#fff;border:2px dashed var(--line);border-radius:18px;padding:10px 12px}
.list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.item{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:10px 12px}
.item .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.check{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:#fff;cursor:pointer;flex:none;display:grid;place-items:center;padding:0;transition:transform .2s}
.check.on{background:var(--her);border-color:var(--her);animation:popc .35s}
.check.on::after{content:"";width:9px;height:5px;border:2.5px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
@keyframes popc{50%{transform:scale(1.35)}}
.done .grow{color:var(--muted);text-decoration:line-through}
.x{background:none;border:none;color:var(--muted);cursor:pointer;font-size:1.3rem;line-height:1;padding:4px}
.waiting button.w{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;background:var(--blush);border-radius:16px;padding:10px 12px;font-weight:700}
.waiting button.w .go{margin-left:auto;color:var(--her)}
.games{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.game{background:var(--blush);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:4px}
.game .ico{font-family:var(--display);font-size:1.6rem;color:var(--her)}
.boardwrap{overflow-x:auto;border-radius:16px;background:var(--blush);padding:6px}
.board{display:grid;gap:1px;margin:0 auto}
.cell{aspect-ratio:1/1;background:#fff;border-radius:3px;cursor:pointer;border:none;padding:0}
.cell.ph{background-repeat:no-repeat;animation:place .45s cubic-bezier(.2,.9,.3,1.5)}
.cell.old{animation:none}
@keyframes place{from{transform:scale(1.6);opacity:.3}to{transform:none;opacity:1}}
.cell:not(.ph):hover{background:#ffe4ec}
.tray{display:flex;flex-wrap:wrap;gap:6px}
.piece{width:50px;height:50px;border-radius:10px;border:3px solid #fff;cursor:pointer;background-repeat:no-repeat;padding:0;box-shadow:0 2px 6px rgba(58,31,43,.15);transition:transform .15s}
.piece.sel{border-color:var(--gold);transform:scale(1.15) rotate(-4deg)}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.progress{height:10px;background:var(--blush);border-radius:99px;overflow:hidden}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--her),var(--gold),var(--him));transition:width .4s}
.scenes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.scenes button{border:3px solid transparent;border-radius:14px;padding:0;overflow:hidden;cursor:pointer;background:none;display:flex;flex-direction:column}
.scenes img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.scenes span{font-size:.72rem;font-weight:700;padding:3px 0;color:var(--muted)}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gallery figure{margin:0}
.gallery img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:14px;display:block}
.gallery figcaption{font-size:.72rem;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}
.mood{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pin{background:var(--blush);border-radius:16px;padding:12px;font-family:var(--display);font-weight:600;overflow-wrap:anywhere;transform:rotate(-1.5deg)}
.pin:nth-child(even){transform:rotate(1.5deg);background:#ecfaf7}
.pin img{width:100%;border-radius:10px;display:block}
.truth{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px}
.truth.appr{background:#fff9ec;border-color:#ffe2a8}
.truth ul{margin:0;padding-left:18px}
.banner{background:#fff6e5;border-radius:16px;padding:10px 12px;font-size:.88rem;font-weight:600}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabs .in{display:flex;width:100%;max-width:560px}
.tabs button{flex:1;border:none;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;color:var(--muted);font-size:.72rem;font-weight:800;border-radius:16px}
.tabs button svg{width:24px;height:24px;transition:transform .25s}
.tabs button.on{color:var(--her)}
.tabs button.on svg{transform:translateY(-3px) scale(1.12);fill:#ffe4ec}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(58,31,43,.28);display:flex;align-items:flex-end;justify-content:center}
.sheet.hidden{display:none}
.sheet .panel{background:#fff;border-radius:28px 28px 0 0;width:100%;max-width:560px;max-height:90%;overflow:auto;padding:20px 16px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;animation:slide .3s cubic-bezier(.2,.9,.3,1.1)}
@keyframes slide{from{transform:translateY(100%)}to{transform:none}}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);z-index:30;background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;font-size:.9rem;opacity:0;pointer-events:none;transition:all .25s;max-width:90%;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.float{position:fixed;z-index:40;pointer-events:none;color:var(--her);animation:up 2.2s ease-out forwards}
.float svg{width:30px;height:30px}
@keyframes up{from{transform:translateY(0) scale(.5);opacity:1}to{transform:translateY(-60vh) scale(1.4) rotate(20deg);opacity:0}}
.confetti{position:fixed;top:-12px;z-index:41;width:9px;height:14px;border-radius:3px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.pick button{border-radius:24px;padding:18px 10px;font-family:var(--display);font-size:1.2rem;font-weight:600;cursor:pointer;border:2px solid var(--line);background:#fff;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:var(--shadow)}
.pick button.a{color:var(--her)} .pick button.i{color:var(--him)}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opts button{width:44px;height:44px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line);cursor:pointer;padding:0;overflow:hidden;background:#fff}
.opts button.on{box-shadow:0 0 0 3px var(--her)}
.opts.wide button{width:auto;height:auto;border-radius:999px;padding:6px 12px;font-weight:700;font-size:.85rem}
.loading{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--her)}
.loading svg{width:56px;height:56px;animation:beat 1.2s ease-in-out infinite}
.scenes button.hl{border-color:var(--her)}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.cats button{flex:none;border:none;border-radius:999px;padding:8px 14px;font-weight:800;background:var(--blush);color:var(--muted);cursor:pointer}
.cats button.on{background:var(--her);color:#fff}
.btn.on{background:var(--ink);border-color:var(--ink);color:#fff}
#board{display:block;margin:0 auto;cursor:pointer;touch-action:manipulation}
canvas.piece{width:60px;height:60px;border:none;border-radius:10px;cursor:pointer;background:transparent;box-shadow:none;transition:transform .15s}
canvas.piece.sel{transform:scale(1.2) rotate(-5deg);filter:drop-shadow(0 0 6px var(--gold)) drop-shadow(0 0 2px var(--gold))}
.tray{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;background:var(--blush);border-radius:18px;padding:8px}
.spark{position:fixed;z-index:45;width:44px;height:44px;margin:-22px 0 0 -22px;pointer-events:none;animation:sparkle .9s ease-out forwards}
.spark.good{color:var(--her)} .spark.bad{color:#e11d48}
.spark svg{width:100%;height:100%}
@keyframes sparkle{0%{transform:scale(.3);opacity:1}60%{transform:scale(1.4) translateY(-10px);opacity:1}100%{transform:scale(1.6) translateY(-30px);opacity:0}}
.win{position:fixed;inset:0;z-index:50;background:rgba(58,31,43,.5);display:grid;place-items:center;padding:16px;animation:fadein .3s}
@keyframes fadein{from{opacity:0}}
.winCard{background:#fff;border-radius:32px;padding:26px 18px 16px;width:min(100%,400px);max-height:94vh;overflow:auto;text-align:center;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:10px;align-items:center;animation:zoomin .6s cubic-bezier(.2,.9,.3,1.4)}
@keyframes zoomin{from{transform:scale(.4) rotate(-8deg);opacity:0}}
.winCard>*{position:relative;z-index:1}
.winCard .rays{position:absolute;z-index:0;left:50%;top:120px;width:900px;height:900px;margin:-450px 0 0 -450px;background:repeating-conic-gradient(#fff4dc 0 9deg,#fff 9deg 18deg);animation:spin 14s linear infinite;border-radius:50%}
@keyframes spin{to{transform:rotate(360deg)}}
.winCard h1{font-size:2rem;color:var(--her)}
.crown{width:96px;margin-bottom:-26px;z-index:2!important;animation:drop 1s .35s cubic-bezier(.3,1.6,.5,1) both}
.crown svg{width:100%}
@keyframes drop{from{transform:translateY(-240px) rotate(-40deg);opacity:0}to{transform:rotate(-8deg);opacity:1}}
.winAv{animation:winbounce 1.2s .2s ease-in-out infinite;border-radius:50%;box-shadow:0 0 0 6px #fff,0 0 0 10px var(--gold)}
@keyframes winbounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.winCard .bridge{color:var(--her);width:34px;height:34px;animation:beat 1.2s infinite}
.score{display:flex;align-items:baseline;gap:14px;font-family:var(--display);font-size:2.4rem;font-weight:700}
.winPic{width:70%;border-radius:16px;box-shadow:var(--shadow)}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gal .ph:first-child{grid-column:span 2;grid-row:span 2}
.ph{position:relative;border:none;padding:0;border-radius:16px;overflow:hidden;cursor:pointer;background:var(--blush);aspect-ratio:1/1;transition:transform .2s}
.ph:active{transform:scale(.96)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .dot{position:absolute;left:8px;bottom:8px;width:10px;height:10px;box-shadow:0 0 0 2px #fff}
.ph .tag{position:absolute;right:6px;top:6px;background:rgba(255,255,255,.92);color:var(--her);font-size:.68rem;font-weight:800;border-radius:99px;padding:2px 8px}
.strip{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.strip .ph{border-radius:12px}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px;text-align:center;color:var(--her)}
.empty svg{width:40px;height:40px;animation:beat 1.6s infinite}
.seg{display:flex;background:var(--blush);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;border:none;background:transparent;border-radius:999px;padding:7px 4px;cursor:pointer;font-weight:800;font-size:.82rem;color:var(--muted)}
.seg button.on{background:#fff;color:var(--her);box-shadow:0 1px 4px rgba(58,31,43,.1)}
.lb{position:fixed;inset:0;z-index:60;background:rgba(20,10,16,.94);color:#fff;display:none;flex-direction:column;gap:12px;padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 16px)}
.lb.on{display:flex;animation:fadein .25s}
.lbTop{display:flex;justify-content:space-between;align-items:center}
.lbImg{flex:1;min-height:0;display:grid;place-items:center}
.lbImg img{max-width:100%;max-height:100%;object-fit:contain;border-radius:12px;animation:pop .35s}
.lbCap{text-align:center;font-weight:700}
.lb .btn{background:rgba(255,255,255,.12);border-color:transparent;color:#fff}
.lb .btn.primary{background:var(--her)}

/* ---------- game area ---------- */
.glist{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gtile{all:unset;cursor:pointer;background:#fff;border:1px solid var(--line);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow);transition:transform .15s}
.gtile:active{transform:scale(.96)}
.gtile .chip{align-self:flex-start;margin-top:4px}
.gico{width:42px;height:42px;border-radius:14px;background:var(--blush);color:var(--her);display:grid;place-items:center}
.gico svg{width:26px;height:26px}
.gstat{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.qcard{background:var(--blush);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.opts2{display:flex;flex-direction:column;gap:8px}
.btn.opt{justify-content:flex-start;text-align:left;border-radius:16px;background:#fff}
.btn.opt:hover{border-color:var(--her)}
.pc{position:relative;width:58px;height:84px;border-radius:9px;background:#fff;border:1.5px solid #e9d6dd;box-shadow:0 2px 6px rgba(58,31,43,.12);flex:none;padding:0;color:var(--ink);font-family:var(--display)}
.pc .cn{position:absolute;font-size:.78rem;font-weight:700;line-height:1}
.pc .tl{left:5px;top:5px}.pc .br{right:5px;bottom:5px;transform:rotate(180deg)}
.pc.whot{color:#a3123a}.pc.whot svg.big{position:absolute;inset:22px 11px;width:36px;height:36px;fill:#a3123a}
.pc .wtxt{position:absolute;top:28px;width:100%;text-align:center;font-weight:700;font-size:.8rem;letter-spacing:.05em}.pc .wn{position:absolute;top:44px;width:100%;text-align:center;font-weight:700}
.pc.std .pip{position:absolute;inset:0;display:grid;place-items:center;font-size:1.8rem}
.pc.std.red{color:#e11d48}
.pc.back{background:repeating-linear-gradient(45deg,#ff4f7e 0 6px,#ff7d9a 6px 12px);border-color:#fff}
