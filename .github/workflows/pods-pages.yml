name: Publish Pods on GitHub Pages

# Pods is hosted free on GitHub Pages at https://teoonia.github.io/anthonia-planner/pods/
# (Netlify still hosts Weekly Board and Parla). One-time setup: repo Settings → Pages →
# Build and deployment → Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - "public/pods/**"
      - ".github/workflows/pods-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pods-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}pods/
    steps:
      - uses: actions/checkout@v5
      - name: Prepare the site
        run: |
          mkdir -p site
          cp -r public/pods site/pods
          printf '<!DOCTYPE html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=pods/"><title>Pods</title><a href="pods/">Open Pods</a>\n' > site/index.html
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
