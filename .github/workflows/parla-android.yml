name: Build Parla! Android app

on:
  push:
    branches: [main]
    paths:
      - "parla-app/**"
      - ".github/workflows/parla-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: parla-app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: parla-app/package-lock.json

      - run: npm ci
      - run: npx cap sync android

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Build the app
        working-directory: parla-app/android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../../parla.apk

      - name: Publish the download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: parla-${{ github.run_number }}
          name: Parla! Italian coach (build ${{ github.run_number }})
          body: Download parla.apk on your Samsung and open it to install or update.
          files: parla.apk
          make_latest: false
