name: Build Pods Android app

on:
  push:
    branches: [main]
    paths:
      - "pods-app/**"
      - ".github/workflows/pods-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pods-app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pods-app/package-lock.json

      - run: npm ci

      - run: npx cap sync android

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Build the app
        working-directory: pods-app/android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../../pods.apk

      - name: Publish the download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pods-${{ github.run_number }}
          name: Pods (build ${{ github.run_number }})
          body: Download pods.apk on your Android phone and open it to install or update. The app always shows the newest Pods, so you only reinstall when a new build appears here.
          files: pods.apk
          make_latest: false
