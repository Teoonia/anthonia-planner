name: Publish on GitHub Pages

# Free hosting with no monthly limit (Netlify's free credits ran out):
# Each app lives in its own folder with its own storage, so they never affect each other:
#   Weekly Board  https://teoonia.github.io/anthonia-planner/board/
#   Pods          https://teoonia.github.io/anthonia-planner/pods/
#   Parla!        https://teoonia.github.io/anthonia-planner/parla/
on:
  push:
    branches: [main]
    paths-ignore:
      - "android/**"
      - "pods-app/**"
      - "parla-app/**"
      - "test/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build Weekly Board (Pods and Parla come along from public/)
        run: npm run build
        env:
          BASE: /anthonia-planner/board/
      - name: Put each app in its own folder
        run: |
          mkdir -p site
          mv dist/pods site/pods
          mv dist/parla site/parla
          mv dist site/board
          printf '<!DOCTYPE html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=pods/"><title>Pods</title><a href="pods/">Open Pods</a>\n' > site/index.html
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
